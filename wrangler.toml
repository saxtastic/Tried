name = "ayeyoty-co"
compatibility_date = "2026-08-08"

# Static venue served directly from Cloudflare's edge (Workers Static Assets).
# No worker script: every response is a file under ./public, and public/_headers
# supplies the security and caching headers at deploy time.
[assets]
directory = "./public"
not_found_handling = "404-page"   # serves public/404.html

# Attach the domain in the Cloudflare dashboard under
# Workers & Pages > ayeyoty-co > Settings > Domains & Routes, or uncomment
# the routes below once ayeyoty.co is proxied through Cloudflare.
# [[routes]]
# pattern = "ayeyoty.co"
# custom_domain = true

# [[routes]]
# pattern = "www.ayeyoty.co"
# custom_domain = true
