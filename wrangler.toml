name = "ayeyoty-co"
compatibility_date = "2026-08-08"

# The venue is static; every response is a file under ./public, and
# public/_headers supplies the security and caching headers at deploy time.
#
# One exception: src/index.js handles POST /mfile/manifest and falls through to
# the asset binding for everything else. The endpoint is inert until its secret
# exists, so a deploy without it serves the site and refuses the endpoint:
#
#   npx wrangler secret put MFILE_TOKEN
main = "src/index.js"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"   # serves public/404.html

# Attach the domain in the Cloudflare dashboard under
# Workers & Pages > ayeyoty-co > Settings > Domains & Routes, or uncomment
# the routes below once ayeyoty.co is proxied through Cloudflare.
# [[routes]]
# pattern = "ayeyoty.co"
# custom_domain = true

# [[routes]]
# pattern = "www.ayeyoty.co"
# custom_domain = true
